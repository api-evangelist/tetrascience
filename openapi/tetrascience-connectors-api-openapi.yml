    ConnectorFileDto:
      type: object
      description: A file reported by a Connector.
      properties:
        id:
          type: string
          description: The file's id.
        uniqueExternalId:
          type: string
          description: The file's unique external id, used by Connectors to deduplicate external files.
        filepath:
          type: string
          description: The file's path.
        status:
          type: string
          description: The file's status, as reported by the Connector. This reflects the Connector's own workflow to upload files, not the platform's processing of those files.
          enum:
          - PENDING
          - PROCESSING
          - SKIPPED
          - SUCCESS
          - ERROR
        metadata:
          type: object
        errorCount:
          type: number
          description: The number of times the file has errored during upload. After 5 errors, the Connector will stop attempting to retry this file.
        errorMessage:
          type: string
          description: The last error message reported by the Connector for this file.
        updatedAt:
          format: date-time
          type: string
          description: The last time the file's details were updated.
        createdAt:
          format: date-time
          type: string
          description: The time the file was created.
      required:
      - id
      - uniqueExternalId
      - filepath
      - status
      - metadata
      - errorCount
      - updatedAt
      - createdAt
    LabelDto:
