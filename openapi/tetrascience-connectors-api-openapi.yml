    ConnectorDetailsDto:
      type: object
      description: Details of a single Connector.
      properties:
        id:
          type: string
          description: The Connector's id.
        name:
          type: string
          description: The Connector's name.
        orgSlug:
          type: string
          description: The organization slug that the Connector belongs to.
        description:
          type: string
          description: The Connector's description.
        artifact:
          description: The Connector's artifact details. If include=artifacts is specified on the request, it will be the ArtifactDetailsDto; otherwise it will be the ArtifactDto.
          oneOf:
          - $ref: '#/components/schemas/ArtifactDto'
          - $ref: '#/components/schemas/ArtifactDetailsDto'
        hostType:
          type: string
          description: The type of host the Connector is running on.
          enum:
          - cloud
          - hub
        hub:
          description: Details of the Hub the Connector is running on, if any.
          $ref: '#/components/schemas/HubDto'
        metadata:
          description: The Connector's metadata. Deprecated in favor of labels.
          type: object
        tags:
          description: The Connector's tags. Deprecated in favor of labels.
          type: array
          items:
            type: string
        labels:
          description: The Connector's labels.
          type: array
          items:
            $ref: '#/components/schemas/LabelDto'
        commandQueue:
          type: string
          description: The ARN of the Connector's command queue.
        clusterArn:
          type: string
          description: The ARN of the ECS cluster the Connector is running in.
        taskDefinitionArn:
          type: string
          description: The ARN of the ECS task definition the Connector is running.
        health:
          type: string
          description: The health status of the Connector. N/A indicates the Connector has never reported health.
          enum:
          - HEALTHY
          - WARNING
          - CRITICAL
          - N/A
        healthErrorCode:
          type: string
          description: The error code of the Connector's health status, if unhealthy. Defined by each Connector and used to display an error message in the UI.
        operatingStatus:
          type: string
          description: The desired operating status of the Connector. RUNNING means the Connector should run all tasks; IDLE means the Connector software should run and awaiting commands, but not performing its main (Connector-defined) tasks yet; DISABLED means the software should not run at all.
        networkStatus:
          type: string
          description: The network status of the Connector.
          enum:
          - Online
          - Offline
        config:
          type: object
          description: The Connector's current configuration, schema varies per Connector.
        lastSeenAt:
          format: date-time
          type: string
          description: The last time the Connector was seen by the platform.
        updatedAt:
          format: date-time
          type: string
          description: The last time the Connector's details were updated.
        createdAt:
          format: date-time
          type: string
          description: The time the Connector was created.
      required:
      - id
      - name
      - orgSlug
      - artifact
      - hostType
      - metadata
      - tags
      - labels
      - commandQueue
      - clusterArn
      - taskDefinitionArn
      - health
      - operatingStatus
      - networkStatus
      - lastSeenAt
      - updatedAt
      - createdAt
