        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        description: Page size - number of the workflow results to retrieve for a given page.
        schema:
          type: integer
          format: int32
          default: 1000
      - name: filter
        in: query
        description: 'Filter by the workflow completion status. Possible values are: `all` - for all the workflows (completed and failed), `failed` - for the workflows that failed or were canceled, and `completed` - for the workflows that completed successfully.'
        schema:
          type: string
          default: all
      - name: pipelineId
        in: query
        description: Optional parameter. If provided, only the workflows associated with this pipelineid are retrieved. Otherwise, the workflows from all the pipelines are retrieved.
